<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // GitHub Pages has no server-side rewrites, so a direct load or
      // refresh of a deep link (e.g. /lua-pastry-studio/club) 404s here.
      // Stash the real URL and bounce to index.html, which restores it
      // via history.replaceState before React Router reads the path —
      // see the inline script in index.html.
      sessionStorage.redirect = location.href;
    </script>
    <meta http-equiv="refresh" content="0;URL='/lua-pastry-studio/'" />
  </head>
  <body></body>
</html>
